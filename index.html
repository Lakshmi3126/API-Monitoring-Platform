<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Monitor</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>API Monitor</h1>
        <button id="add-api-btn">+ Add API</button>
    </header>

    <!-- Add API Form -->
    <section id="add-api-form" class="add-api-form">

        <h2>Add an API</h2>
        
        <form id="api-form">

            <label for="api-name">API Name</label>
            <input
                type="text"
                id="api-name"
                placeholder="e.g. GitHub API"
                required
            >

            <label for="api-url">API URL</label>
            <input
                type="url"
                id="api-url"
                placeholder="https://api.example.com"
                required
            >

            <label for="api-method">HTTP Method</label>
            <select id="api-method">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
            </select>

            <p id="form-error"></p>

            <div class="form-buttons">
                <button type="submit">Add API</button>
                <button type="button" id="cancel-btn">Cancel</button>
            </div>

        </form>

    </section>

    <!-- Summary -->
    <section class="summary">

        <div class="summary-card">
            <h3>Total APIs</h3>
            <p id="total-apis">0</p>
        </div>

        <div class="summary-card">
            <h3>Healthy</h3>
            <p id="healthy-apis">0</p>
        </div>

        <div class="summary-card">
            <h3>Down</h3>
            <p id="down-apis">0</p>
        </div>

        <div class="summary-card">
            <h3>Avg Response</h3>
            <p id="avg-response">0 ms</p>
        </div>

    </section>


    <!-- API List -->
    <main>

        <h2>Monitored APIs</h2>

        <div id="api-list">

            <!-- API cards will be added here using JavaScript -->

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
